services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/store
      DATABASE_USERNAME: store
      DATABASE_PASSWORD: store
      JWT_SECRET: change-this-development-secret-to-at-least-32-characters
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
