spring.application.name=store-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/store}
spring.datasource.username=${DATABASE_USERNAME:store}
spring.datasource.password=${DATABASE_PASSWORD:store}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
server.port=${PORT:8080}
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
